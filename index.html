<!DOCTYPE html>
<html lang="zh-Hans">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <script>
        /* ── 线路选择 ─────────────────────────────────────────────
           站点在 GitHub Pages，国内访问常常只有十几 KB/s，几百 KB 的分包要等半分钟。
           jsDelivr 是 GitHub 仓库的公共镜像，不需要账号、不需要配置，国内通常快一个数量级。

           切换方式：地址后面加 ?src=cdn 走镜像，?src=gh 回到直连；选过就记在 localStorage。
           实现只用一行 <base>：CSS、分包、作品图、头像全是相对路径，base 一改全部跟着走，
           业务代码一个字都不用动。 */
        (function () {
            /* 留空＝@latest：镜像会跟到最新提交（实测 @main 会滞后半天，@latest 立刻就是新版）。
               想钉死版本就填 commit sha。 */
            var REF = '8687278';
            /* 两个节点分工，实测（167KB 内核包 / 70KB 图）：
                 fastly      JS、CSS 0.5 秒 —— 但对 png/jpg/webp 一律 301 到 raw.githubusercontent.com，
                             国内基本连不上，图会全空；
                 testingcf   位图直接 200，70KB 约 2 秒；JS 慢些（2 秒），所以只让它发图。
               gcore 与 testingcf 同家备用，哪天都不通就把 IMG_HOST 换过去试。 */
            var HOST = 'fastly';
            var IMG_HOST = 'testingcf';
            var VER = '@' + (REF || 'latest') + '/';
            var CDN = 'https://' + HOST + '.jsdelivr.net/gh/jay110/rf-wiki' + VER;
            var IMG = 'https://' + IMG_HOST + '.jsdelivr.net/gh/jay110/rf-wiki' + VER;
            var q = '';
            try { q = location.search; } catch (e) { }
            var pick = '';
            try {
                var m = /[?&]src=(cdn|gh)/.exec(q);
                if (m) pick = m[1];
                else pick = localStorage.getItem('rfwiki.src') || '';
            } catch (e) { }
            if (pick !== 'cdn' && pick !== 'gh') pick = 'gh';
            try {
                if (/[?&]src=(cdn|gh)/.test(q)) localStorage.setItem('rfwiki.src', pick);
            } catch (e) { }
            window.__SRC = pick;
            window.__IMG_BASE = pick === 'cdn' ? IMG : '';
            /* 站点图标是 HTML 里的静态 link，走的是 base（fastly），png 会被 301 掉；
               解析完再指到图片节点上，标签页与「添加到主屏」的图标才不会缺。 */
            if (pick === 'cdn') {
                document.addEventListener('DOMContentLoaded', function () {
                    var ls = document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]');
                    for (var i = 0; i < ls.length; i++) {
                        var h = ls[i].getAttribute('href') || '';
                        if (h.indexOf('assets/') === 0) ls[i].href = IMG + h;
                    }
                });
            }
            window.__switchSrc = function (to) {
                var u;
                try { u = new URL(location.href); } catch (e) { u = null; }
                if (u) { u.searchParams.set('src', to); location.href = u.href; }
                else location.href = location.pathname + '?src=' + to + (location.hash || '');
            };
            if (pick === 'cdn') document.write('<base href="' + CDN + '">');
        })();
    </script>

    <script>
        /* ── 站内 hash 链接的接管 ──────────────────────────────────────
           镜像线路下 <base> 指向 fastly.jsdelivr.net，文档本身却还在 jay110.github.io。
           href="#/setting" 这种只换 hash 的链接，浏览器会按 base 去解析，得到的是
           fastly…/@sha/#/setting —— 域都换了，就不再算「同文档锚点」，浏览器会真的发一次
           导航请求；jsDelivr 对目录返回的是文件列表页，整站就这么跳走了。
           设置、攻略、居民、提醒四个 tab，连同条目卡片、切换作品、返回链接全在这条路上。

           这里统一接管：只含 fragment 的站内链接不再交给浏览器解析，直接改 location.hash。
           直连线路下与原生行为完全一致；Ctrl／⌘／中键照旧另开窗口。 */
        (function () {
            document.addEventListener('click', function (e) {
                if (e.defaultPrevented || e.button !== 0 ||
                    e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
                var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
                if (!a || (a.target && a.target !== '_self') || a.hasAttribute('download')) return;
                var h = a.getAttribute('href');
                if (!h || h.charAt(0) !== '#') return;
                e.preventDefault();
                if (location.hash !== h) location.hash = h;
            }, false);
        })();
    </script>
    <meta name="description" content="符文工房（Rune Factory）系列中文资料站：世界观设定、牧场生活、战斗与生产系统、各作角色与系列作品一览。">
    <meta name="keywords" content="符文工房,符文工厂,Rune Factory,ルーンファクトリー,攻略,世界观,设定">
    <title>符文工房攻略百科</title>
    <link rel="icon" href="assets/icon/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" href="assets/icon/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/content.css">
    <!-- 内核包（gzip 52KB）是首屏唯一的必需品。它本来在 body 末尾才被发现，
         预载让下载与 CSS 同时开始，省一个来回。 -->
    <link rel="preload" href="js/k-core.js" as="script">
    <style>
        /* 首屏骨架：内核包执行完之前先给个东西看。样式内联，不依赖还在下的 CSS 文件。
           渲染函数整块替换 #main，骨架不需要手动摘。 */
        #boot {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: .8rem; min-height: 62vh;
            font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        #boot svg { width: 44px; height: 44px; stroke: #198d44; fill: none; stroke-width: 1.4;
            stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
        #boot b { font-weight: 500; font-size: 15px; letter-spacing: .06em; color: #5c6b73; }
        #boot .boot-tip { font-size: 12px; color: #9aa6ac; }
        #boot .boot-bar { display: block; width: 92px; height: 2px; border-radius: 2px;
            overflow: hidden; background: rgba(25, 141, 68, .14); }
        #boot .boot-bar::after { content: ''; display: block; width: 32px; height: 100%;
            border-radius: 2px; background: #198d44; animation: bootmove 1.15s ease-in-out infinite; }
        @keyframes bootmove { 0% { transform: translateX(-34px) } 100% { transform: translateX(96px) } }
        @media (prefers-reduced-motion: reduce) {
            #boot .boot-bar::after { animation: none; width: 100%; opacity: .3 }
        }
        /* 兜底提示：8 秒还没画出来才出现，正常情况下用户永远看不到 */
        .boot-fail {
            margin: 1.4rem auto 0; max-width: 22rem; padding: .7rem .9rem;
            border: 1px solid #e3e8ea; border-radius: 10px; background: #fafbfb;
            font: 400 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #5c6b73; text-align: center;
        }
        .boot-fail a { color: #198d44; text-decoration: none; border-bottom: 1px solid rgba(25, 141, 68, .35); }

        /* ── 入场（标题屏）──────────────────────────────────────────────
           内核包还没下来那几百毫秒里，页面原本是一块白。这里先摆一张「标题卡」顶着：
           符文环由虚转实、芜菁弹出来、站名逐行落下；第一页画出来就开始退场，
           首页封面接着自上而下依次落位——看到的是「进入」，不是「白屏转圈」。
           全部内联：这层判的就是「css/main.css 还没到」，等它就没意义了。 */
        #splash {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
            background:
                radial-gradient(62% 46% at 50% 38%, rgba(25, 141, 68, .10), rgba(25, 141, 68, 0) 70%),
                linear-gradient(180deg, #ffffff, #f6faf7);
            touch-action: none; overscroll-behavior: contain;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            transition: opacity .42s ease-in;
        }
        #splash.sp-out { opacity: 0; visibility: hidden; transition: opacity .42s ease-in, visibility 0s .42s; }
        .sp-in { display: flex; flex-direction: column; align-items: center; text-align: center;
            transition: transform .52s cubic-bezier(.3, .7, 0, 1); }
        #splash.sp-out .sp-in { transform: scale(1.05); }

        .sp-ring { position: relative; width: 172px; height: 172px; }
        .sp-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .sp-ring circle { fill: none; transform-box: fill-box; transform-origin: center; }
        /* 外圈：极细虚线，慢慢顺转 */
        .sp-ring-a { stroke: rgba(25, 141, 68, .20); stroke-width: .9; stroke-dasharray: 2 7;
            animation: sp-spin 26s linear infinite; }
        /* 中圈：四段等分弧，逆转。周长 458.7，76+38.7 正好四份 */
        .sp-ring-b { stroke: rgba(25, 141, 68, .32); stroke-width: 1.2; stroke-dasharray: 76 38.7;
            animation: sp-spin-r 40s linear infinite, sp-fade .9s ease-out both; }
        /* 内圈：实线一笔画出来（周长 390），画完就留在那儿 */
        .sp-ring-c { stroke: #198d44; stroke-width: 1.8; stroke-linecap: round;
            stroke-dasharray: 390; stroke-dashoffset: 390; transform: rotate(-90deg);
            animation: sp-draw 1.1s cubic-bezier(.35, .05, .2, 1) .08s forwards; }
        .sp-mark { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px;
            margin: -32px 0 0 -32px; opacity: 0; image-rendering: pixelated;
            animation: sp-pop .8s cubic-bezier(.2, .9, .25, 1.06) .16s both; }

        .sp-jp, .sp-name, .sp-en, .sp-bar, .sp-tip { opacity: 0;
            animation: sp-up .72s cubic-bezier(.22, .68, 0, 1) both; }
        .sp-jp { margin-top: 1.6rem; font-size: .68rem; letter-spacing: .34em; color: #9aa6ac; animation-delay: .36s; }
        .sp-name { margin-top: .5rem; font-size: 1.4rem; font-weight: 700; letter-spacing: .07em; color: #3a4750; animation-delay: .46s; }
        .sp-en { margin-top: .34rem; font-size: .58rem; letter-spacing: .3em; color: #b3bec4; animation-delay: .56s; }
        .sp-bar { margin-top: 1.6rem; width: 108px; height: 2px; border-radius: 2px; overflow: hidden;
            background: rgba(25, 141, 68, .13); animation-delay: .66s; }
        .sp-bar i { display: block; width: 34%; height: 100%; border-radius: 2px; background: #198d44;
            animation: sp-run 1.3s ease-in-out infinite; }
        .sp-tip { margin-top: .95rem; font-size: .7rem; letter-spacing: .12em; color: #c2cbd0;
            animation-delay: .58s; animation-duration: .5s; }

        @keyframes sp-spin { to { transform: rotate(360deg) } }
        @keyframes sp-spin-r { to { transform: rotate(-360deg) } }
        @keyframes sp-draw { to { stroke-dashoffset: 0 } }
        @keyframes sp-fade { from { opacity: 0 } to { opacity: 1 } }
        @keyframes sp-pop { from { opacity: 0; transform: scale(.55) } to { opacity: 1; transform: scale(1) } }
        @keyframes sp-up { from { opacity: 0; transform: translateY(9px) } to { opacity: 1; transform: none } }
        @keyframes sp-run { 0% { transform: translateX(-40px) } 100% { transform: translateX(112px) } }

        /* 标题屏退场的同时，首页封面一行一行落下来。挂 html.intro 才生效，
           进站后这个类会被摘掉，之后从别的页回首页不会重放。 */
        html.intro .wcover > * { animation: sp-up .62s cubic-bezier(.22, .68, 0, 1) both; }
        html.intro .wcover > :nth-child(2) { animation-delay: .05s }
        html.intro .wcover > :nth-child(3) { animation-delay: .10s }
        html.intro .wcover > :nth-child(4) { animation-delay: .15s }
        html.intro .wcover > :nth-child(5) { animation-delay: .20s }
        html.intro .wcover > :nth-child(6) { animation-delay: .25s }
        html.intro .wcover > :nth-child(7) { animation-delay: .30s }

        /* 宽屏上别缩在正中间一小团：环、徽标、站名一起放大一档 */
        @media (min-width: 720px) {
            .sp-ring { width: 224px; height: 224px; }
            .sp-mark { width: 96px; height: 96px; margin: -48px 0 0 -48px; }
            .sp-jp { margin-top: 2rem; font-size: .78rem; letter-spacing: .4em; }
            .sp-name { margin-top: .62rem; font-size: 1.86rem; letter-spacing: .09em; }
            .sp-en { margin-top: .42rem; font-size: .64rem; letter-spacing: .34em; }
            .sp-bar { margin-top: 2rem; width: 140px; }
            .sp-bar i { width: 46px; }
            @keyframes sp-run { 0% { transform: translateX(-52px) } 100% { transform: translateX(146px) } }
            .sp-tip { margin-top: 1.15rem; font-size: .74rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .sp-ring circle, .sp-mark, .sp-jp, .sp-name, .sp-en, .sp-bar, .sp-bar i, .sp-tip,
            html.intro .wcover > * {
                animation: none !important; opacity: 1 !important;
            }
            .sp-ring-c { stroke-dashoffset: 0 }
            #splash, #splash.sp-out { transition-duration: .2s }
            .sp-in { transition: none }
        }
    </style>
</head>

<body>
    <!-- 入场标题屏。静态标签 + 内联样式，HTML 一解析就能画，不等任何外部文件。
         时序在页面末尾那段脚本里：第一页画出来 / 轻触 / 2.8 秒，谁先到算谁。 -->

        <div class="sp-in">
            <div class="sp-ring">

    <!-- Service Worker：stale-while-revalidate，首访缓存、回访秒开、离线可用。
         文件在仓库根目录 sw.js，scope 取 './'；改了本文件或 index.html 记得把 sw.js 里 CACHE 版本号 +1 -->
    <script>
        /* 镜像线路不注册 SW：脚本来自 cdn.jsdelivr.net，跨域资源进不了本站的预缓存名单，
           留着只会白下一次。切回直连时照旧注册。注册地址用绝对路径——base 指向镜像时，
           相对路径会被解析成 CDN 上的 sw.js，跨域注册直接失败。 */
        if (window.__SRC && window.__SRC !== 'cdn' && 'serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register(new URL('sw.js', location.href).href, { scope: './' })
                    .catch(function () { });
            });
        }
    </script>

    <!-- 三个包：清单、加载器、内核。其余源文件由 _build_chunks.js 打成 js/k-*.js，
         进哪一作、开哪一页才下哪一个。源文件顺序见 js/_manifest.json。
         k-body.js（全部条目正文，近 500KB gzip）不在首屏之列：首页、作品目录、居民名册
         都用 pages-meta.js 里的元数据画，不需要正文；点开条目才拉它。 -->
    <script defer src="js/k-plan.js"></script>
    <script defer src="js/k-loader.js"></script>
    <script defer src="js/k-core.js"></script>

    <!-- 镜像偶尔会跟不上最新提交。万一 CDN 上的内核包还是旧版，图片会整屏空白 ——
         resImg 是这一版新增的函数，用它当「新版已到」的标记；没到就自动切回直连，
         别让人盯着一屏空卡片。 -->
    <script>
        /* 用 load 而不是定时器：defer 的内核包此时已经跑完，resImg 在不在是确定答案；
           定时器在后台标签页会被浏览器节流，真出问题时反而拖到最后才救。 */
        window.addEventListener('load', function () {
            if (window.__SRC === 'cdn' && typeof window.resImg === 'undefined') {
                try { localStorage.setItem('rfwiki.src', 'gh'); } catch (e) { }
                window.__switchSrc('gh');
            }
        });
    </script>
    <!-- 标题屏退场：三个出口，谁先到算谁。
         ① #main 里的 #boot 消失＝第一页已经画出来（正常情况，900ms 起跳）；
         ② 轻触／点击任意处——不想等的人不必等；
         ③ 2.8 秒硬闸——网络卡住时这层也必须让开，否则下面那条 8 秒兜底提示
            被盖住，用户只看得见一个不动的徽标。
         必须放在 DOM 末尾：要拿到 #main 才能盯着它。#boot 的替换由渲染函数整块
         innerHTML 完成，所以只看子节点，不用 app.js 回传任何东西。 -->
    <script>
        (function () {
            var sp = document.getElementById('splash');
            if (!sp) return;
            var root = document.documentElement;

            /* 开关读独立键：本段必须早于 app.js，读不到 S 那份设置快照 */
            var off = false;
            try { off = localStorage.getItem('rfwiki.intro') === '0'; } catch (e) { }
            if (off) { if (sp.parentNode) sp.parentNode.removeChild(sp); return; }

            var reduce = false;
            try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }
            var MIN = reduce ? 380 : 900;
            var t0 = Date.now();
            var done = false;

            root.className += ' intro';

            function out() {
                if (done) return;
                var wait = MIN - (Date.now() - t0);
                if (wait > 0) { setTimeout(out, wait); return; }
                done = true;
                sp.className = 'sp-out';
                setTimeout(function () {
                    if (sp.parentNode) sp.parentNode.removeChild(sp);
                }, 480);
                /* 进站动画只播一次：散场后摘掉标记，之后从别的页回首页不再重放 */
                setTimeout(function () {
                    root.className = root.className.replace(/\s*\bintro\b/, '');
                }, 1900);
            }

            var m = document.getElementById('main');
            if (m && !document.getElementById('boot')) {
                /* 内联单文件版或极快的情况：骨架可能已经换掉了 */
                out();
            } else if (m && window.MutationObserver) {
                var ob = new MutationObserver(function () {
                    if (document.getElementById('boot')) return;
                    ob.disconnect();
                    out();
                });
                ob.observe(m, { childList: true });
            }

            sp.addEventListener('click', function () {
                if (Date.now() - t0 > 240) out();
            });
            setTimeout(out, reduce ? 1100 : 2800);
        })();
    </script>

    <!-- 兜底：脚本没跑起来（网络卡住／Service Worker 换版时旧缓存被删）也要能自救。
         8 秒后 #main 里还是骨架或「正在载入资料」，就补一条重试提示。
         正常渲染的页面上这两样都不存在，所以这段平时不会做任何事。 -->
    <script>
        setTimeout(function () {
            var m = document.getElementById('main');
            if (!m) return;
            if (!document.getElementById('boot') && !/正在载入资料/.test(m.textContent || '')) return;
            if (m.querySelector('.boot-fail')) return;
            var d = document.createElement('div');
            d.className = 'boot-fail';
            var toCdn = window.__SRC !== 'cdn';
            d.innerHTML = '资料没载完，可能是网络卡住了　' +
                '<a href="javascript:location.reload()">点这里刷新</a>' +
                '<br><a href="javascript:void 0" onclick="__switchSrc(\'' + (toCdn ? 'cdn' : 'gh') + '\');return false">' +
                (toCdn ? '换加速线路（镜像 CDN）' : '换回直连（GitHub）') + '</a>' +
                '<div style="margin-top:.5rem;font-size:12px;color:#9aa6ac">当前线路：' +
                (toCdn ? '直连 GitHub' : '镜像 CDN') + '</div>';
            m.appendChild(d);
        }, 8000);
    </script>
