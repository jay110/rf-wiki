<!DOCTYPE html>
<html lang="zh-Hans">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="符文工房（Rune Factory）系列中文资料站：世界观设定、牧场生活、战斗与生产系统、各作角色与系列作品一览。">
    <meta name="keywords" content="符文工房,符文工厂,Rune Factory,ルーンファクトリー,攻略,世界观,设定">
    <title>符文工房攻略百科</title>
    <link rel="icon" href="assets/icon/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" href="assets/icon/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/content.css">
    <!-- 内核包（gzip 52KB）是首屏唯一的必需品。它本来在 body 末尾才被发现，
         预载让下载与 CSS 同时开始，省一个来回。 -->
    <link rel="preload" href="js/k-core.js" as="script">
    <style>
        /* 首屏骨架：内核包执行完之前先给个东西看。样式内联，不依赖还在下的 CSS 文件。
           渲染函数整块替换 #main，骨架不需要手动摘。 */
        #boot {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: .8rem; min-height: 62vh;
            font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        #boot svg { width: 44px; height: 44px; stroke: #198d44; fill: none; stroke-width: 1.4;
            stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
        #boot b { font-weight: 500; font-size: 15px; letter-spacing: .06em; color: #5c6b73; }
        #boot .boot-tip { font-size: 12px; color: #9aa6ac; }
        #boot .boot-bar { display: block; width: 92px; height: 2px; border-radius: 2px;
            overflow: hidden; background: rgba(25, 141, 68, .14); }
        #boot .boot-bar::after { content: ''; display: block; width: 32px; height: 100%;
            border-radius: 2px; background: #198d44; animation: bootmove 1.15s ease-in-out infinite; }
        @keyframes bootmove { 0% { transform: translateX(-34px) } 100% { transform: translateX(96px) } }
        @media (prefers-reduced-motion: reduce) {
            #boot .boot-bar::after { animation: none; width: 100%; opacity: .3 }
        }
    </style>
</head>

<body>
    <div id="app">
        <header class="titlebar">
            <button class="back" id="backBtn" aria-label="返回">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 5.2 8 12l7 6.8" />
                </svg>
            </button>
            <div id="titleText">符文工房攻略百科</div>
            <button class="tsearch" id="searchBtn" aria-label="搜索条目">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10.6" cy="10.6" r="6.2" />
                    <path d="M15.3 15.3 20 20" />
                </svg>
            </button>
            <a class="mark" id="mark" href="#/" title="返回站点主页">WIKI</a>
        </header>

        <main class="main" id="main">
            <div id="boot" role="status" aria-live="polite">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 5.4c2.6-1.1 5.3-1.1 8 .6 2.7-1.7 5.4-1.7 8-.6v13c-2.6-1.1-5.3-1.1-8 .6-2.7-1.7-5.4-1.7-8-.6z" />
                    <path d="M12 6v13" />
                </svg>
                <b>符文工房攻略百科</b>
                <span class="boot-bar"></span>
                <span class="boot-tip">正在载入资料</span>
            </div>
        </main>

        <nav class="tabbar">
            <a href="#/wiki" data-tab="wiki">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10.6 12 3.4l9 7.2V20a1.2 1.2 0 0 1-1.2 1.2H4.2A1.2 1.2 0 0 1 3 20z" />
                    <path d="M9.4 21.2v-6.3h5.2v6.3" />
                </svg>
                <div>攻略</div>
            </a>
            <a href="#/resident" data-tab="resident">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="8.2" r="3.3" />
                    <path d="M2.8 20.4c0-3.1 2.8-5.3 6.2-5.3s6.2 2.2 6.2 5.3" />
                    <path d="M16.2 5.4a3 3 0 0 1 0 5.9" />
                    <path d="M17.4 15.4c2.3.5 3.9 2.2 3.9 5" />
                </svg>
                <div>居民</div>
            </a>
            <a href="#/todo" data-tab="todo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8.6a6 6 0 1 0-12 0c0 5.2-2 6.7-2 6.7h16s-2-1.5-2-6.7" />
                    <path d="M13.7 19.2a2 2 0 0 1-3.4 0" />
                </svg>
                <div>提醒</div>
            </a>
            <a href="#/setting" data-tab="setting">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3.1" />
                    <path d="M12 2.6v2.8M12 18.6v2.8M2.6 12h2.8M18.6 12h2.8M5.4 5.4l2 2M16.6 16.6l2 2M18.6 5.4l-2 2M7.4 16.6l-2 2" />
                </svg>
                <div>设置</div>
            </a>
        </nav>
    </div>

    <!-- Service Worker：stale-while-revalidate，首访缓存、回访秒开、离线可用。
         文件在仓库根目录 sw.js，scope 取 './'；改了本文件或 index.html 记得把 sw.js 里 CACHE 版本号 +1 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () { });
            });
        }
    </script>

    <!-- 三个包：清单、加载器、内核。其余源文件由 _build_chunks.js 打成 js/k-*.js，
         进哪一作、开哪一页才下哪一个。源文件顺序见 js/_manifest.json。
         k-body.js（全部条目正文，近 500KB gzip）不在首屏之列：首页、作品目录、居民名册
         都用 pages-meta.js 里的元数据画，不需要正文；点开条目才拉它。 -->
    <script defer src="js/k-plan.js"></script>
    <script defer src="js/k-loader.js"></script>
    <script defer src="js/k-core.js"></script>
</body>

</html>
